name: Automated Resume ATS Audit & Badge Action

on:
  pull_request:
    paths:
      - '**.pdf'
      - '**.docx'
      - '**.txt'
      - '**.md'
      - 'resumes/**'
  workflow_dispatch:

jobs:
  audit-resume:
    name: Audit Modified Resumes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Find Modified Resume Files
        id: files
        run: |
          # Get list of changed files matching resume patterns
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref || 'main' }} HEAD | grep -E '\.(pdf|docx|txt|md)$' || true)
          echo "resumes=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Run CLI Audit on Changed Resumes
        if: steps.files.outputs.resumes != ''
        run: |
          mkdir -p ./ats-reports
          mkdir -p ./badges
          
          for file in ${{ steps.files.outputs.resumes }}; do
            if [ -f "$file" ]; then
              base=$(basename "$file")
              echo "Auditing $file..."
              python -m app.cli "$file" -o "./ats-reports/${base}.json" -b "./badges/${base}_badge.svg"
            fi
          done
        working-directory: ./backend

      - name: Post PR Comment with Audit Summary
        if: github.event_name == 'pull_request' && steps.files.outputs.resumes != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportsDir = './backend/ats-reports';
            
            if (!fs.existsSync(reportsDir)) return;
            
            const files = fs.readdirSync(reportsDir);
            let comment = '### 🤖 AI Resume Analyser - Automated ATS Audit Summary\n\n';
            
            for (const file of files) {
              if (file.endsWith('.json')) {
                const data = JSON.parse(fs.readFileSync(path.join(reportsDir, file), 'utf8'));
                comment += `#### 📄 File: \`${file.replace('.json', '')}\`\n`;
                comment += `* **Overall ATS Score:** **${data.ats_score}/100**\n`;
                comment += `* **Strengths Detected:** ${data.key_strengths ? data.key_strengths.length : 0}\n`;
                if (data.keywords && data.keywords.missing && data.keywords.missing.length > 0) {
                  comment += `* ⚠️ **Missing Target Keywords:** ${data.keywords.missing.slice(0, 6).join(', ')}\n`;
                }
                comment += '\n---\n';
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
